<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260">
  <rect x="20" y="80" width="200" height="100" rx="12" ry="12" fill="#e5e7eb" stroke="#111827"/>
  <text x="120" y="135" text-anchor="middle" font-family="Arial" font-size="14">Client (dig/drill)</text>
  <rect x="290" y="60" width="200" height="140" rx="12" ry="12" fill="#d1fae5" stroke="#065f46"/>
  <text x="390" y="95" text-anchor="middle" font-family="Arial" font-size="14">BIND9 Resolver</text>
  <text x="390" y="115" text-anchor="middle" font-family="Arial" font-size="12">DNSSEC=auto • QNAME=min</text>
  <text x="390" y="135" text-anchor="middle" font-family="Arial" font-size="12">Query logging=on</text>
  <rect x="560" y="80" width="200" height="100" rx="12" ry="12" fill="#e0e7ff" stroke="#3730a3"/>
  <text x="660" y="120" text-anchor="middle" font-family="Arial" font-size="14">Authoritative /</text>
  <text x="660" y="140" text-anchor="middle" font-family="Arial" font-size="14">Upstream DNS</text>
  <line x1="220" y1="130" x2="290" y2="130" stroke="#111827" marker-end="url(#arrow)"/>
  <line x1="490" y1="130" x2="560" y2="130" stroke="#111827" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827" />
    </marker>
  </defs>
</svg>
