# Nginx as a secure API gateway
# - terminates TLS (use mkcert or openssl to generate certs into nginx/certs)
# - enforces HTTP security headers
# - applies basic rate limiting before traffic hits FastAPI

upstream app_backend {
    server app:8000;
}

limit_req_zone $binary_remote_addr zone=per_client:10m rate=30r/m;

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/secure_access.log;
    error_log /var/log/nginx/secure_error.log;

    location / {
        limit_req zone=per_client burst=10 nodelay;
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
